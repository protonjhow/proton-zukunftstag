---
# Session 1 "Secret messages" demo.
#   NATS  = "the internet"
#   Vault = "the VPN" (transit wraps each message before it leaves)
#   chat  = the kids' chat page     http://<host>:8000/?me=<name>
#   eve   = the TV in the room      http://<host>:8001
services:
  nats:
    image: nats:2.10
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.18
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: zukunftstag-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: zukunftstag-root
    volumes:
      - ./vault/init.sh:/init.sh:ro
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "vault", "read", "transit-nats/keys/demo_key"]
      interval: 2s
      retries: 30

  chat:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "secretmsgs.chat_app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      NATS_URL: nats://nats:4222
      ZT_VAULT_ADDR: http://vault:8200
      ZT_VAULT_TOKEN: zukunftstag-root
    ports:
      - "8000:8000"
    depends_on:
      nats:
        condition: service_started
      vault:
        condition: service_healthy

  # Eve gets no Vault settings: she only sees what crosses NATS.
  eve:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "secretmsgs.eve_app:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      NATS_URL: nats://nats:4222
      EVE_WORDLIST: /app/wordlists/en.txt
    ports:
      - "8001:8001"
    depends_on:
      nats:
        condition: service_started
