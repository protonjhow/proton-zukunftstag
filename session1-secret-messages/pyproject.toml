[project]
name = "secretmsgs"
version = "0.1.0"
description = "Zukunftstag session 1: secret messages demo (chat, Eve, VPN)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "nats-py",
    "hvac",
]

[project.optional-dependencies]
dev = ["pytest", "httpx2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["secretmsgs"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["vault: needs a running Vault (ZT_VAULT_ADDR set)"]
