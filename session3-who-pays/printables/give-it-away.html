<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Give it away?</title>
<style>
  @page { size: A4; margin: 8mm; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  * { box-sizing: border-box; }
  html, body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1c1b24; font-size: 10.5pt; }
  main { width: 194mm; height: 281mm; display: flex; flex-direction: column; gap: 3mm; }
  h1 { font-size: 19pt; margin: 0; }
  p { margin: 0; }
  .today { font-size: 12pt; font-weight: 600; background: #eef7ff; border-radius: 3mm; padding: 2.5mm 3.5mm; }
  .premise { font-size: 13pt; font-weight: 700; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; flex: 1; }
  .opt { border: 0.5mm solid #999; border-radius: 3mm; padding: 2.5mm 3.5mm; display: flex; flex-direction: column; gap: 1.5mm; }
  .opt h2 { font-size: 12.5pt; margin: 0; }
  .opt p { font-size: 10pt; }
  .opt .line { border-bottom: 0.3mm solid #aaa; height: 7mm; }
  .opt.bank { background: #fff1f1; border-color: #ff5c72; }
  .opt .sum { font-weight: 700; font-size: 10.5pt; line-height: 1.9; }
  .choose { font-weight: 700; font-size: 12pt; }
  .line { border-bottom: 0.3mm solid #aaa; height: 7mm; }
  .fair { background: #e9f7ef; border: 0.6mm solid #1ea672; border-radius: 3mm; padding: 3mm 4mm; font-size: 11.5pt; font-weight: 600; }
  .footer { text-align: center; font-size: 9pt; color: #666; font-style: italic; }
</style>
</head>
<body>
<main id="root"></main>
<script>
  // All text on this page, in one place for translation.
  const TEXT = {
    title: "🎁 Give it away?",
    today: "Today we sold ______ cups at CHF ______ each. Our profit: CHF ______",
    premise: "Tomorrow every cup is FREE. But lemons still cost money, and the bank still wants its money back. How will you pay?",
    options: [
      { icon: "📢", title: "Adverts", lines: 2, prompts: [
        "Who in the office might pay to put an advert on your cups or your sign? How much for one day?",
        "What would your customers think of the adverts?",
      ] },
      { icon: "🗂️", title: "Sell what you know", lines: 2, prompts: [
        "Look at “what we noticed about our customers” on your sales sheet. Who might pay for that?",
        "How would your customers feel if they found out?",
      ] },
      { icon: "🧊", title: "Pay for extras", lines: 3, prompts: [
        "The lemonade is free… but what could you charge extra for?",
      ] },
      { icon: "🏦", title: "Borrow more and get them hooked", lines: 1, bank: true, prompts: [
        "The bank lends you CHF 20 more. You must pay back CHF 22. You give lemonade away free for a whole week, and everyone gets used to it. Then you start charging.",
      ], sums: [
        "At CHF 1 a cup, how many cups to pay back 22? ______",
        "At CHF 2 a cup? ______",
        "What if people stop coming when it isn't free any more?",
      ] },
    ],
    choose: "Which one would you choose? Why?",
    fair: "🏷️ Or… charge a fair price from the start. Your customers pay you, so you never have to sell them. That's how Proton works.",
    footer: "Using free apps isn't bad. It's smart to know how they pay for themselves.",
  };

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };

  const root = document.getElementById("root");
  root.append(el("h1", null, TEXT.title), el("p", "today", TEXT.today), el("p", "premise", TEXT.premise));
  const grid = el("div", "options");
  for (const o of TEXT.options) {
    const box = el("div", o.bank ? "opt bank" : "opt");
    box.append(el("h2", null, `${o.icon} ${o.title}`));
    for (const p of o.prompts) box.append(el("p", null, p));
    for (const s of o.sums || []) box.append(el("p", "sum", s));
    for (let i = 0; i < o.lines; i++) box.append(el("div", "line"));
    grid.append(box);
  }
  root.append(grid, el("p", "choose", TEXT.choose), el("div", "line"), el("div", "line"), el("p", "fair", TEXT.fair), el("p", "footer", TEXT.footer));
  document.title = TEXT.title.replace(/^\S+ /, "");
</script>
</body>
</html>
